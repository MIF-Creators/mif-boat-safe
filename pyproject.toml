[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mif-boat-safe"
version = "0.1.0"
description = "Fleet management for autonomous boats in a pool: vehicle, navigation server and control center over MQTT."
readme = "README.md"
requires-python = ">=3.10"
# Shared by all three components.
dependencies = [
    "paho-mqtt>=2.0.0",
    "python-dotenv>=1.0.0",
]

# One group per machine: install the groups for what runs on it,
# e.g. `pip install -e ".[nav]"`. See README.md.
[project.optional-dependencies]
# The boat needs only the shared dependencies; on a Raspberry Pi add `rpi`.
vehicle = []
# Motor GPIO, Raspberry Pi only. Without it the boat runs a mock motor driver.
rpi = ["RPi.GPIO>=0.7.0"]
nav = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
]
control = ["flask>=2.3.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
boat-vehicle = "system.vehicle.main:main"
boat-nav = "system.navigation_server.main:main"
boat-control = "system.control_center.main:main"

[tool.setuptools.packages.find]
include = ["system", "system.*"]

[tool.setuptools.package-data]
"system.control_center" = ["templates/*", "static/*"]

[tool.ruff]
# Old code, kept for reference only.
extend-exclude = ["legacy"]

[tool.ruff.lint]
# E9: syntax errors; F: pyflakes (unused imports and variables, undefined names).
select = ["E9", "F"]
