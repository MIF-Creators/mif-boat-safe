name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install -r system/requirements.txt
          python -m pip install ruff==0.16.8

      - name: Lint Python code
        run: python -m ruff check system tests --select E9,F63,F7,F82

      - name: Run tests
        run: python -m pytest

  sast:
    name: SAST - Bandit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Bandit
        run: python -m pip install bandit==1.9.4

      - name: Scan Python code
        run: python -m bandit -r system

  sca:
    name: SCA - pip-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Audit dependencies
        run: python -m pip_audit -r system/requirements.txt